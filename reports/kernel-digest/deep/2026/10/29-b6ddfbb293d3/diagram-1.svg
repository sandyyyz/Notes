<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diagram-title" font-family="Noto Sans CJK SC, sans-serif" viewBox="0 0 1436 832"><title id="diagram-title">触发链与新旧修复路径</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#555"/></marker></defs><path d="M250,112 L718,176" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><text x="492" y="144" text-anchor="start" fill="#444" font-size="15"><tspan x="492" dy="0">解析存入</tspan></text><path d="M718,248 L718,312" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><text x="726" y="280" text-anchor="start" fill="#444" font-size="15"><tspan x="726" dy="0">端点策略变化</tspan></text><path d="M718,384 L718,448" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><text x="726" y="416" text-anchor="start" fill="#444" font-size="15"><tspan x="726" dy="0">调用 delopt</tspan></text><path d="M718,520 L484,584" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><text x="609" y="552" text-anchor="start" fill="#444" font-size="15"><tspan x="609" dy="0">旧代码</tspan></text><path d="M718,520 L952,584" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><text x="843" y="552" text-anchor="start" fill="#444" font-size="15"><tspan x="843" dy="0">新代码</tspan></text><path d="M484,656 L718,720" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><text x="609" y="688" text-anchor="start" fill="#444" font-size="15"><tspan x="609" dy="0">读陈旧尾部，optlen</tspan><tspan x="609" dy="18">被污染</tspan></text><path d="M952,656 L718,720" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><text x="843" y="688" text-anchor="start" fill="#444" font-size="15"><tspan x="843" dy="0">optlen 正确</tspan></text><rect x="40" y="40" width="420" height="72" rx="8" fill="#fafafa" stroke="#888"/><text x="250" y="68" text-anchor="middle" fill="#222" font-size="17">setsockopt(IP_OPTIONS)</text><text x="250" y="89" text-anchor="middle" fill="#222" font-size="17">放入 CIPSO+其他选项</text><rect x="508" y="176" width="420" height="72" rx="8" fill="#fafafa" stroke="#888"/><text x="718" y="204" text-anchor="middle" fill="#222" font-size="17">socket 的</text><text x="718" y="225" text-anchor="middle" fill="#222" font-size="17">ip_options（__data/optlen</text><rect x="508" y="312" width="420" height="72" rx="8" fill="#fafafa" stroke="#888"/><text x="718" y="340" text-anchor="middle" fill="#222" font-size="17">SELinux/NetLabel 删除</text><text x="718" y="361" text-anchor="middle" fill="#222" font-size="17">CIPSO 路径</text><rect x="508" y="448" width="420" height="72" rx="8" fill="#fafafa" stroke="#888"/><text x="718" y="476" text-anchor="middle" fill="#222" font-size="17">cipso_v4_delopt():</text><text x="718" y="497" text-anchor="middle" fill="#222" font-size="17">memmove 移出 CIPSO</text><rect x="274" y="584" width="420" height="72" rx="8" fill="#fafafa" stroke="#888"/><text x="484" y="625" text-anchor="middle" fill="#222" font-size="17">旧逻辑：移动后遍历重算 optlen</text><rect x="742" y="584" width="420" height="72" rx="8" fill="#fafafa" stroke="#888"/><text x="952" y="625" text-anchor="middle" fill="#222" font-size="17">新逻辑：移动前计算并减 cipso_len</text><rect x="508" y="720" width="420" height="72" rx="8" fill="#fafafa" stroke="#888"/><text x="718" y="748" text-anchor="middle" fill="#222" font-size="17">socket 上的</text><text x="718" y="769" text-anchor="middle" fill="#222" font-size="17">opt-&gt;opt.optlen</text><rect x="508" y="40" width="420" height="72" rx="8" fill="#fafafa" stroke="#888"/><text x="718" y="81" text-anchor="middle" fill="#222" font-size="17">越界拷贝（optlen 超过缓冲区）</text><rect x="976" y="40" width="420" height="72" rx="8" fill="#fafafa" stroke="#888"/><text x="1186" y="81" text-anchor="middle" fill="#222" font-size="17">拷贝长度正确</text></svg>