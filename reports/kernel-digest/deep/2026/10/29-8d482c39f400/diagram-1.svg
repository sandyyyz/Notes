<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diagram-title" font-family="Noto Sans CJK SC, sans-serif" viewBox="0 0 968 560"><title id="diagram-title">Redox Ring Buffer 的目标通信路径（对照传统 IPC）</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#555"/></marker></defs><path d="M484,112 L250,176" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><text x="375" y="144" text-anchor="start" fill="#444" font-size="15"><tspan x="375" dy="0">提交/收割请求</tspan></text><path d="M250,248 L484,312" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><text x="375" y="280" text-anchor="start" fill="#444" font-size="15"><tspan x="375" dy="0">写 SQE / 读 CQE</tspan></text><path d="M484,384 L484,448" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><text x="492" y="416" text-anchor="start" fill="#444" font-size="15"><tspan x="492" dy="0">消费 SQE / 写 CQE</tspan></text><path d="M484,112 L718,176" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><text x="609" y="144" text-anchor="start" fill="#444" font-size="15"><tspan x="609" dy="0">尚未迁移的服务仍走旧通道</tspan></text><path d="M718,248 C948,248 948,448 484,448" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><text x="940" y="348" text-anchor="end" fill="#444" font-size="15"><tspan x="940" dy="0">逐次往返</tspan></text><rect x="274" y="40" width="420" height="72" rx="8" fill="#fafafa" stroke="#888"/><text x="484" y="81" text-anchor="middle" fill="#222" font-size="17">应用</text><rect x="40" y="176" width="420" height="72" rx="8" fill="#fafafa" stroke="#888"/><text x="250" y="217" text-anchor="middle" fill="#222" font-size="17">类 io_uring/liburing API</text><rect x="274" y="312" width="420" height="72" rx="8" fill="#fafafa" stroke="#888"/><text x="484" y="353" text-anchor="middle" fill="#222" font-size="17">Ring Buffer（SQ/CQ 环）</text><rect x="274" y="448" width="420" height="72" rx="8" fill="#fafafa" stroke="#888"/><text x="484" y="476" text-anchor="middle" fill="#222" font-size="17">system task / 驱动（async</text><text x="484" y="497" text-anchor="middle" fill="#222" font-size="17">executor）</text><rect x="508" y="176" width="420" height="72" rx="8" fill="#fafafa" stroke="#888"/><text x="718" y="217" text-anchor="middle" fill="#222" font-size="17">传统同步 IPC 通道</text></svg>